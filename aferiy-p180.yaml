# Board: ESP32 DevKit V1 (Espressif)
# Bluetooth Proxy + AFERIY AF-P180 monitoring
#
# Final production configuration after reverse engineering of the P180 C305
# live/status (0x04) and holding/settings (0x03) register blocks.
#
# IMPORTANT:
# - Monitoring only. This YAML does not write settings to the AFERIY.
# - Unknown/diagnostic registers and register-dump buttons were removed.

esphome:
  name: esp32-dev-bluetooth-proxy
  friendly_name: esp32-dev-bluetooth-proxy

  # AFERIY is exposed as a separate logical device in Home Assistant.
  devices:
    - id: aferiy_device
      name: "AFERIY P180"

esp32:
  variant: esp32
  flash_size: 4MB
  framework:
    type: esp-idf


# -------------------------------------------------
# LOGGING
# -------------------------------------------------

logger:


# -------------------------------------------------
# HOME ASSISTANT API
# -------------------------------------------------

api:
  encryption:
    key: !secret api_encryption_key


# -------------------------------------------------
# OTA
# -------------------------------------------------

ota:
  - platform: esphome
    password: !secret ota_password


# -------------------------------------------------
# WIFI
# -------------------------------------------------

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: esp32-dev-bluet Fallback Hotspot
    password: !secret fallback_ap_password
  reboot_timeout: 0s

captive_portal:


# -------------------------------------------------
# BLUETOOTH
#
# 4 total BLE connections:
# - up to 3 for Bluetooth Proxy / BMS
# - 1 for AFERIY
# -------------------------------------------------

esp32_ble:
  max_connections: 4

esp32_ble_tracker:

bluetooth_proxy:
  active: true
  connection_slots: 3


# -------------------------------------------------
# ESP-FBot — BLE poller for AFERIY
# -------------------------------------------------

external_components:
  - source: github://ylianst/esp-fbot
    refresh: 1d

ble_client:
  - mac_address: "AA:BB:CC:DD:EE:FF"  # Replace with your AFERIY P180 BLE MAC address
    id: aferiy_ble

fbot:
  id: aferiy_p180
  ble_client_id: aferiy_ble
  polling_interval: 5s
  settings_polling_interval: 30s
  poll_timeout: 15s
  max_poll_failures: 5


# ESP-FBot has unconditional dependencies on switch and binary_sensor.
switch:
  - platform: template
    name: "ESP-FBot Build Helper"
    internal: true
    optimistic: true


# -------------------------------------------------
# AFERIY P180 — confirmed binary states
# -------------------------------------------------

binary_sensor:
  - platform: template
    name: "ESP-FBot Binary Sensor Helper"
    internal: true

  # R53 group 0x28 — AC input present
  - platform: template
    id: aferiy_ac_input_present
    name: "AC Input Present"
    device_id: aferiy_device

  # R53 bit 0x40 — active battery charging
  - platform: template
    id: aferiy_charging
    name: "Charging"
    device_id: aferiy_device

  # R75 bit 0x10 — AC output enabled
  - platform: template
    id: aferiy_ac_output_enabled
    name: "AC Output Enabled"
    device_id: aferiy_device

  # R75 bit 0x04 — 12 V DC output enabled
  - platform: template
    id: aferiy_dc_output_enabled
    name: "DC Output Enabled"
    device_id: aferiy_device

  # R75 bit 0x08 — USB output enabled
  - platform: template
    id: aferiy_usb_output_enabled
    name: "USB Output Enabled"
    device_id: aferiy_device


# -------------------------------------------------
# AFERIY P180 — confirmed live sensors
# -------------------------------------------------

sensor:

  # Battery SOC — R31
  - platform: template
    id: aferiy_soc
    name: "Battery"
    device_id: aferiy_device
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never

  # AC charging power — R02
  # Portion of AC input currently charging the battery.
  - platform: template
    id: aferiy_ac_charging_power
    name: "AC Charging Power"
    device_id: aferiy_device
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never

  # Actual power drawn from the AC grid.
  # When AC input is present: R02 + R12.
  - platform: template
    id: aferiy_ac_grid_input_power
    name: "AC Grid Input Power"
    device_id: aferiy_device
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never

  # DC / Solar input — R03
  - platform: template
    id: aferiy_dc_input_power
    name: "DC Input Power"
    device_id: aferiy_device
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never

  # Total input = AC Grid Input + DC Input
  - platform: template
    id: aferiy_total_input_power
    name: "Total Input Power"
    device_id: aferiy_device
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never

  # AC output — R12
  - platform: template
    id: aferiy_ac_output_power
    name: "AC Output Power"
    device_id: aferiy_device
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never

  # DC + USB output — R78
  - platform: template
    id: aferiy_dc_output_power
    name: "DC + USB Output Power"
    device_id: aferiy_device
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never

  # Total output = R12 + R78
  - platform: template
    id: aferiy_total_output_power
    name: "Total Output Power"
    device_id: aferiy_device
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never

  # AC input voltage — R08 / 10
  - platform: template
    id: aferiy_ac_input_voltage
    name: "AC Input Voltage"
    device_id: aferiy_device
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never

  # AC input frequency — R09 / 100
  - platform: template
    id: aferiy_ac_input_frequency
    name: "AC Input Frequency"
    device_id: aferiy_device
    unit_of_measurement: "Hz"
    device_class: frequency
    state_class: measurement
    accuracy_decimals: 2
    update_interval: never

  # Actual AC output voltage — R10 / 10
  - platform: template
    id: aferiy_ac_output_voltage
    name: "AC Output Voltage"
    device_id: aferiy_device
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never

  # Configured AC output frequency — R11 / 10
  # Confirmed: 500 = 50.0 Hz, 600 = 60.0 Hz.
  - platform: template
    id: aferiy_ac_output_frequency_setting
    name: "AC Output Frequency Setting"
    device_id: aferiy_device
    unit_of_measurement: "Hz"
    device_class: frequency
    accuracy_decimals: 1
    update_interval: never

  # Time to full charge — R71, minutes
  - platform: template
    id: aferiy_time_to_full
    name: "Time To Full"
    device_id: aferiy_device
    unit_of_measurement: "min"
    device_class: duration
    accuracy_decimals: 0
    update_interval: never

  # Remaining runtime — R72, minutes
  - platform: template
    id: aferiy_remaining_time
    name: "Remaining Time"
    device_id: aferiy_device
    unit_of_measurement: "min"
    device_class: duration
    accuracy_decimals: 0
    update_interval: never


  # -------------------------------------------------
  # AFERIY P180 — confirmed read-only settings
  # Values are read from C305 function 0x03 every 30 s.
  # -------------------------------------------------

  # H23 — maximum DC/XT60 charging current, A
  - platform: template
    id: aferiy_max_dc_charging_current
    name: "Max DC Charging Current"
    device_id: aferiy_device
    unit_of_measurement: "A"
    device_class: current
    accuracy_decimals: 0
    update_interval: never

  # H24 — AC output no-load auto-off timeout, minutes; 0 = Never
  - platform: template
    id: aferiy_ac_no_load_auto_off
    name: "AC No-load Auto-off"
    device_id: aferiy_device
    unit_of_measurement: "min"
    device_class: duration
    accuracy_decimals: 0
    update_interval: never

  # H25 — screen-off timeout is stored in seconds; expose as minutes.
  - platform: template
    id: aferiy_screen_off_timeout
    name: "Screen Off Timeout"
    device_id: aferiy_device
    unit_of_measurement: "min"
    device_class: duration
    accuracy_decimals: 0
    update_interval: never

  # H26 / 10 — lower battery discharge threshold, %
  - platform: template
    id: aferiy_discharge_threshold
    name: "Discharge Threshold"
    device_id: aferiy_device
    unit_of_measurement: "%"
    accuracy_decimals: 1
    update_interval: never

  # H27 / 10 — upper battery charge threshold, %
  - platform: template
    id: aferiy_charge_threshold
    name: "Charge Threshold"
    device_id: aferiy_device
    unit_of_measurement: "%"
    accuracy_decimals: 1
    update_interval: never

  # H28 — full-device auto power-off timeout, minutes
  - platform: template
    id: aferiy_device_auto_power_off
    name: "Device Auto Power-off"
    device_id: aferiy_device
    unit_of_measurement: "min"
    device_class: duration
    accuracy_decimals: 0
    update_interval: never

  # H29 — USB no-load auto-off timeout, minutes; 0 = Never
  - platform: template
    id: aferiy_usb_no_load_auto_off
    name: "USB No-load Auto-off"
    device_id: aferiy_device
    unit_of_measurement: "min"
    device_class: duration
    accuracy_decimals: 0
    update_interval: never

  # H30 — DC no-load auto-off timeout, minutes; 0 = Never
  - platform: template
    id: aferiy_dc_no_load_auto_off
    name: "DC No-load Auto-off"
    device_id: aferiy_device
    unit_of_measurement: "min"
    device_class: duration
    accuracy_decimals: 0
    update_interval: never


# -------------------------------------------------
# C305 PARSER
#
# Confirmed live/status map (function 0x04):
# R02 = AC charging power, W
# R03 = DC input power, W
# R08 = AC input voltage x10
# R09 = AC input frequency x100
# R10 = actual AC output voltage x10
# R11 = configured AC output frequency x10
# R12 = AC output power, W
# R31 = Battery SOC, %
# R53 group 0x28 = AC input present
# R53 bit 0x40 = active charging
# R71 = time to full, min
# R72 = remaining runtime, min
# R75 bit 0x04 = DC output enabled
# R75 bit 0x08 = USB output enabled
# R75 bit 0x10 = AC output enabled
# R78 = DC + USB output power, W
#
# Confirmed settings map (function 0x03):
# H23 = max DC charging current, A
# H24 = AC no-load auto-off timeout, min (0 = Never)
# H25 = screen-off timeout, seconds
# H26 = discharge threshold x10, %
# H27 = charge threshold x10, %
# H28 = device auto power-off timeout, min
# H29 = USB no-load auto-off timeout, min (0 = Never)
# H30 = DC no-load auto-off timeout, min (0 = Never)
#
# Derived values:
# AC Grid Input = R02 + R12, when AC input is present
# Total Input   = AC Grid Input + R03
# Total Output  = R12 + R78
# -------------------------------------------------

text_sensor:
  - platform: ble_client
    ble_client_id: aferiy_ble
    id: aferiy_raw_c305
    name: "AFERIY P180 Raw C305"
    internal: true

    service_uuid: "A002"
    characteristic_uuid: "C305"

    notify: true
    update_interval: never

    on_notify:
      then:
        - lambda: |-
            // P180 C305 packet: 80 x 16-bit registers starting at byte 6.
            // 0x04 = live/status input registers.
            // 0x03 = holding/settings registers.
            if (x.size() < 166 ||
                static_cast<uint8_t>(x[0]) != 0x11) {
              return;
            }

            const uint8_t function_code =
                static_cast<uint8_t>(x[1]);

            auto reg = [&](int r) -> uint16_t {
              const int pos = 6 + (r * 2);

              return
                (static_cast<uint16_t>(
                    static_cast<uint8_t>(x[pos])) << 8)
                |
                static_cast<uint16_t>(
                    static_cast<uint8_t>(x[pos + 1]));
            };

            // -----------------------------
            // SETTINGS / HOLDING REGISTERS
            // -----------------------------

            if (function_code == 0x03) {
              const float max_dc_charging_current =
                  static_cast<float>(reg(23));

              const float ac_no_load_auto_off =
                  static_cast<float>(reg(24));

              const float screen_off_timeout =
                  static_cast<float>(reg(25)) / 60.0f;

              const float discharge_threshold =
                  static_cast<float>(reg(26)) / 10.0f;

              const float charge_threshold =
                  static_cast<float>(reg(27)) / 10.0f;

              const float device_auto_power_off =
                  static_cast<float>(reg(28));

              const float usb_no_load_auto_off =
                  static_cast<float>(reg(29));

              const float dc_no_load_auto_off =
                  static_cast<float>(reg(30));

              id(aferiy_max_dc_charging_current)
                ->publish_state(max_dc_charging_current);

              id(aferiy_ac_no_load_auto_off)
                ->publish_state(ac_no_load_auto_off);

              id(aferiy_screen_off_timeout)
                ->publish_state(screen_off_timeout);

              id(aferiy_discharge_threshold)
                ->publish_state(discharge_threshold);

              id(aferiy_charge_threshold)
                ->publish_state(charge_threshold);

              id(aferiy_device_auto_power_off)
                ->publish_state(device_auto_power_off);

              id(aferiy_usb_no_load_auto_off)
                ->publish_state(usb_no_load_auto_off);

              id(aferiy_dc_no_load_auto_off)
                ->publish_state(dc_no_load_auto_off);

              return;
            }

            // Everything below is for live/status registers only.
            if (function_code != 0x04) {
              return;
            }

            // -----------------------------
            // LIVE RAW VALUES
            // -----------------------------

            const float ac_charging_power =
                static_cast<float>(reg(2));

            const float dc_input_power =
                static_cast<float>(reg(3));

            const float ac_input_voltage =
                static_cast<float>(reg(8)) / 10.0f;

            const float ac_input_frequency =
                static_cast<float>(reg(9)) / 100.0f;

            const float ac_output_voltage =
                static_cast<float>(reg(10)) / 10.0f;

            const float ac_output_frequency_setting =
                static_cast<float>(reg(11)) / 10.0f;

            const float ac_output_power =
                static_cast<float>(reg(12));

            const float battery_soc =
                static_cast<float>(reg(31));

            const uint16_t status_ac = reg(53);

            const float time_to_full =
                static_cast<float>(reg(71));

            const float remaining_time =
                static_cast<float>(reg(72));

            const uint16_t status_outputs = reg(75);

            const float dc_output_power =
                static_cast<float>(reg(78));


            // -----------------------------
            // DERIVED VALUES
            // -----------------------------

            // Treat AC input as present only above 100 V.
            // This filters residual/induced voltage when the source is off.
            const bool ac_present = ac_input_voltage > 100.0f;

            // In UPS/bypass mode the station's INPUT display corresponds to
            // R02 (battery charging) + R12 (AC load/bypass).
            const float ac_grid_input_power =
                ac_present
                  ? ac_charging_power + ac_output_power
                  : 0.0f;

            const float total_input_power =
                ac_grid_input_power + dc_input_power;

            const float total_output_power =
                ac_output_power + dc_output_power;

            // Confirmed status bits/groups.
            const bool ac_input_present =
                (status_ac & 0x28u) == 0x28u;

            const bool charging =
                (status_ac & 0x40u) != 0;

            const bool ac_output_enabled =
                (status_outputs & 0x10u) != 0;

            const bool dc_output_enabled =
                (status_outputs & 0x04u) != 0;

            const bool usb_output_enabled =
                (status_outputs & 0x08u) != 0;


            // -----------------------------
            // PUBLISH LIVE DATA
            // -----------------------------

            id(aferiy_ac_charging_power)
              ->publish_state(ac_charging_power);

            id(aferiy_ac_grid_input_power)
              ->publish_state(ac_grid_input_power);

            id(aferiy_dc_input_power)
              ->publish_state(dc_input_power);

            id(aferiy_total_input_power)
              ->publish_state(total_input_power);

            id(aferiy_ac_output_power)
              ->publish_state(ac_output_power);

            id(aferiy_dc_output_power)
              ->publish_state(dc_output_power);

            id(aferiy_total_output_power)
              ->publish_state(total_output_power);

            id(aferiy_soc)
              ->publish_state(battery_soc);

            id(aferiy_ac_input_voltage)
              ->publish_state(ac_input_voltage);

            id(aferiy_ac_input_frequency)
              ->publish_state(ac_input_frequency);

            id(aferiy_ac_output_voltage)
              ->publish_state(ac_output_voltage);

            id(aferiy_ac_output_frequency_setting)
              ->publish_state(ac_output_frequency_setting);

            id(aferiy_time_to_full)
              ->publish_state(time_to_full);

            id(aferiy_remaining_time)
              ->publish_state(remaining_time);

            id(aferiy_ac_input_present)
              ->publish_state(ac_input_present);

            id(aferiy_charging)
              ->publish_state(charging);

            id(aferiy_ac_output_enabled)
              ->publish_state(ac_output_enabled);

            id(aferiy_dc_output_enabled)
              ->publish_state(dc_output_enabled);

            id(aferiy_usb_output_enabled)
              ->publish_state(usb_output_enabled);
